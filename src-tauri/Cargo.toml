[package]
name = "lexilens"
version = "0.1.3"
edition = "2021"
license = "MIT"

[lib]
name = "lexilens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
windows = { version = "0.61", features = ["Win32_Media_Speech", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-platform = { path = "../plugins/tauri-plugin-platform" }

[dev-dependencies]
tempfile = "3"
