<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LexiLens — Read deeply. Remember in context.</title>
  <desc id="desc">A dark blue banner with the LexiLens magnifying-glass logo and an illustration of words highlighted in a reading passage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15191e"/>
      <stop offset="1" stop-color="#182b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5897fb"/>
      <stop offset="1" stop-color="#8bc9ed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="55" r="190" fill="#5897fb" opacity=".05"/>
  <circle cx="1080" cy="70" r="138" fill="none" stroke="#5897fb" opacity=".12"/>
  <path d="M48 309H1152" stroke="#a9c1e3" stroke-opacity=".14"/>
  <!-- The project's existing L + lens mark. -->
  <g transform="translate(48 43) scale(.07)">
    <rect width="1024" height="1024" rx="220" fill="#15191e" stroke="#344258" stroke-width="16"/>
    <path d="M274 246h112v420h332v112H274z" fill="#f1f3f5"/>
    <circle cx="666" cy="370" r="121" fill="none" stroke="#5897fb" stroke-width="50"/>
    <path d="m752 456 90 90" stroke="#5897fb" stroke-width="50" stroke-linecap="round"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="137" y="91" fill="#f1f3f5" font-size="42" font-weight="700" letter-spacing="-1">LexiLens</text>
    <text x="49" y="177" fill="#f1f3f5" font-size="42" font-weight="650" letter-spacing="-1">Read deeply.</text>
    <text x="49" y="229" fill="url(#accent)" font-size="42" font-weight="650" letter-spacing="-1">Remember in context.</text>
    <text x="51" y="273" fill="#a6b7ce" font-size="17">Your reading. Your vocabulary. On your device.</text>
    <text x="51" y="337" fill="#a6b7ce" font-size="13" letter-spacing="2">LOCAL-FIRST LEARNING</text>
    <text x="1150" y="337" text-anchor="end" fill="#a6b7ce" font-size="13" letter-spacing="2">WINDOWS / ANDROID</text>
  </g>
  <!-- Concept illustration, deliberately distinct from an application screenshot. -->
  <g transform="translate(732 43)">
    <rect x="15" y="13" width="368" height="230" rx="18" fill="#0d1624" opacity=".4" transform="rotate(4 199 128)"/>
    <rect width="368" height="230" rx="18" fill="#202f44" stroke="#3c516e"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="26" y="37" fill="#96b7e7" font-size="11" letter-spacing="2">A WORD IS MORE THAN A DEFINITION</text>
      <path d="M26 54H342" stroke="#3c516e"/>
      <text x="26" y="90" fill="#e0e8f5" font-size="20">Every word has a story.</text>
      <text x="26" y="124" fill="#e0e8f5" font-size="20">Find its meaning in</text>
      <rect x="24" y="137" width="94" height="29" rx="5" fill="#5897fb" fill-opacity=".23"/>
      <text x="29" y="158" fill="#a9ceff" font-size="20" font-weight="600">context.</text>
      <path d="M26 192H227 M26 205H177" stroke="#7489a5" stroke-width="5" stroke-linecap="round" opacity=".36"/>
    </g>
    <circle cx="314" cy="184" r="34" fill="#202f44" stroke="#78acff" stroke-width="5"/>
    <path d="m340 210 25 25" stroke="#78acff" stroke-width="7" stroke-linecap="round"/>
    <path d="m300 184 9 9 18-20" fill="none" stroke="#99d9bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
